<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-page); }
  .card { padding: 20px 24px; display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  .s { background: var(--oxford-blue); border-radius: 4px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
</head>
<body>
<div class="card">
  <div class="item"><div class="s" style="width:4px;height:4px"></div><span class="label">1 · 4</span></div>
  <div class="item"><div class="s" style="width:8px;height:8px"></div><span class="label">2 · 8</span></div>
  <div class="item"><div class="s" style="width:12px;height:12px"></div><span class="label">3 · 12</span></div>
  <div class="item"><div class="s" style="width:16px;height:16px"></div><span class="label">4 · 16</span></div>
  <div class="item"><div class="s" style="width:24px;height:24px"></div><span class="label">6 · 24</span></div>
  <div class="item"><div class="s" style="width:32px;height:32px"></div><span class="label">8 · 32</span></div>
  <div class="item"><div class="s" style="width:48px;height:48px"></div><span class="label">12 · 48</span></div>
  <div class="item"><div class="s" style="width:64px;height:64px"></div><span class="label">16 · 64</span></div>
  <div class="item"><div class="s" style="width:96px;height:96px"></div><span class="label">24 · 96</span></div>
</div>
</body>
</html>
