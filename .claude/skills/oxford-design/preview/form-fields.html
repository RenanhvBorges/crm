<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-page); }
  .card { padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; font-family: var(--font-sans); font-size: 12px; font-weight: 600; color: var(--fg-2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
  .field { background: #fff; border: 1px solid var(--border-1); border-radius: 8px; padding: 12px 14px; font-family: var(--font-sans); font-size: 15px; color: var(--fg-1); width: 100%; box-sizing: border-box; }
  .field:focus { border-color: var(--oxford-blue); outline: 3px solid var(--oxford-blue-100); }
  .field-focused { border-color: var(--oxford-blue); box-shadow: 0 0 0 3px var(--oxford-blue-100); }
  .help { font-family: var(--font-sans); font-size: 12px; color: var(--fg-3); margin-top: 6px; }
  .error { color: var(--danger); }
</style>
</head>
<body>
<div class="card">
  <div>
    <label>Nome</label>
    <input class="field" value="Renan M." />
    <div class="help">Como devemos te chamar.</div>
  </div>
  <div>
    <label>E-mail</label>
    <input class="field field-focused" value="renan@empresa.com.br" />
    <div class="help">Estado: focado</div>
  </div>
  <div>
    <label>Faturamento mensal</label>
    <select class="field"><option>R$ 100k – R$ 500k</option></select>
  </div>
  <div>
    <label>Telefone</label>
    <input class="field" style="border-color: var(--danger)" value="(11) 999..." />
    <div class="help error">Digite um telefone completo.</div>
  </div>
</div>
</body>
</html>
