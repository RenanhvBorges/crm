<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-surface-2); }
  .card { padding: 24px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; align-items: end; }
  .box { background: #fff; border-radius: 12px; height: 56px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div class="item"><div class="box" style="width:96px; box-shadow: var(--shadow-xs)"></div><span class="label">xs</span></div>
  <div class="item"><div class="box" style="width:96px; box-shadow: var(--shadow-sm)"></div><span class="label">sm</span></div>
  <div class="item"><div class="box" style="width:96px; box-shadow: var(--shadow)"></div><span class="label">base</span></div>
  <div class="item"><div class="box" style="width:96px; box-shadow: var(--shadow-md)"></div><span class="label">md</span></div>
  <div class="item"><div class="box" style="width:96px; box-shadow: var(--shadow-brand); background: var(--oxford-blue);"></div><span class="label">brand</span></div>
</div>
</body>
</html>
