<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-page); }
  .card { padding: 18px 24px; display: flex; align-items: center; justify-content: space-around; gap: 24px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .big { font-family: var(--font-display); font-size: 84px; color: var(--oxford-terracotta); line-height: 1; letter-spacing: -0.01em; }
  .unit { font-family: var(--font-sans); font-size: 13px; color: var(--fg-2); font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="col">
    <div class="big">R$1,2M</div>
    <div class="unit">faturado em 90 dias</div>
    <div class="label">.stat — terracotta</div>
  </div>
  <div class="col">
    <div class="big" style="color: var(--oxford-blue);">+312%</div>
    <div class="unit">ROAS médio</div>
    <div class="label">.stat — blue variant</div>
  </div>
  <div class="col">
    <div class="big">90</div>
    <div class="unit">dias de ciclo</div>
    <div class="label">.stat — numeric only</div>
  </div>
</div>
</body>
</html>
