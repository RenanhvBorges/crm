<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-page); }
  .card { padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); min-width: 140px; }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <span class="meta">Prata · 76 · 1.05</span>
    <span style="font-family: var(--font-display); font-size: 56px; line-height: 1.05; letter-spacing: -0.02em;">Empresário sério.</span>
  </div>
  <div class="row">
    <span class="meta">Prata · 44 · 1.1</span>
    <span style="font-family: var(--font-display); font-size: 36px; line-height: 1.1;">Resultado comprovado.</span>
  </div>
  <div class="row">
    <span class="meta">Cormorant · 30 · italic</span>
    <span style="font-family: var(--font-serif); font-weight: 500; font-style: italic; font-size: 26px;">"Operação estruturada."</span>
  </div>
</div>
</body>
</html>
