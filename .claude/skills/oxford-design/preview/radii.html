<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-page); }
  .card { padding: 20px 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .r { background: var(--oxford-blue); box-shadow: var(--shadow); }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style>
</head>
<body>
<div class="card">
  <div class="item"><div class="r" style="width:56px;height:56px;border-radius:2px"></div><span class="label">xs · 2</span></div>
  <div class="item"><div class="r" style="width:56px;height:56px;border-radius:4px"></div><span class="label">sm · 4</span></div>
  <div class="item"><div class="r" style="width:56px;height:56px;border-radius:8px"></div><span class="label">base · 8</span></div>
  <div class="item"><div class="r" style="width:56px;height:56px;border-radius:12px"></div><span class="label">md · 12</span></div>
  <div class="item"><div class="r" style="width:56px;height:56px;border-radius:16px"></div><span class="label">lg · 16</span></div>
  <div class="item"><div class="r" style="width:56px;height:56px;border-radius:24px"></div><span class="label">xl · 24</span></div>
  <div class="item"><div class="r" style="width:56px;height:56px;border-radius:999px"></div><span class="label">full</span></div>
</div>
</body>
</html>
