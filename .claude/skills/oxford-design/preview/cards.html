<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; background: var(--bg-surface-2); }
  .wrap { padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: #fff; border: 1px solid var(--border-1); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
  .card .eyebrow { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.16em; color: var(--oxford-terracotta); margin-bottom: 8px; }
  .card h4 { font-family: var(--font-sans); font-weight: 700; font-size: 18px; margin: 0 0 6px; color: var(--fg-1); }
  .card p { font-family: var(--font-sans); font-size: 13px; color: var(--fg-2); margin: 0; line-height: 1.5; }
  .card--brand { background: var(--oxford-blue); color: #fff; border-color: transparent; box-shadow: var(--shadow-brand); }
  .card--brand .eyebrow { color: rgba(255,255,255,0.7); }
  .card--brand h4 { color: #fff; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
  .card--brand p { color: rgba(255,255,255,0.8); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="eyebrow">Case · e-commerce</div>
    <h4>R$ 80k → R$ 310k em 90 dias</h4>
    <p>Reestruturação de funil, criativos e gestão diária do tráfego pago.</p>
  </div>
  <div class="card card--brand">
    <div class="eyebrow">Diagnóstico</div>
    <h4>Sua agência está te enganando?</h4>
    <p>Em 30 minutos mostramos o que está queimando seu orçamento.</p>
  </div>
</div>
</body>
</html>
